[package]
name = "cloudiful-server"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "Rust web server bootstrap crate with Actix and Axum adapters"
readme = "README.md"
license = "Apache-2.0"
repository = "https://github.com/cloudiful/server"
documentation = "https://docs.rs/cloudiful-server"
keywords = ["server", "actix", "axum", "tls", "bootstrap"]
categories = ["web-programming", "network-programming", "asynchronous"]

[features]
default = []
actix = ["dep:actix-cors", "dep:actix-web"]
axum = ["dep:axum", "dep:axum-server", "dep:tower-http", "dep:tokio"]
mcp = ["dep:axum", "dep:axum-server", "dep:rmcp", "dep:tokio", "dep:tokio-util"]

[dependencies]
actix-cors = { version = "0.7.1", optional = true }
actix-web = { version = "4.14.1", optional = true, default-features = false, features = [ "macros", "rustls-0_23" ] }
axum = { version = "0.8.9", optional = true }
axum-server = { version = "0.8.0", optional = true, features = [ "tls-rustls" ] }
http = "1.5.0"
log = "0.4.33"
rustls = "0.23.43"
rustls-pemfile = "2.2.0"
tokio = { version = "1.53.1", optional = true, features = [ "io-util", "macros", "net", "rt-multi-thread", "sync", "time" ] }
tokio-util = { version = "0.7.19", optional = true }
tower-http = { version = "0.7", features = ["cors"], optional = true }
rmcp = { version = "3.1.2", optional = true, features = [ "server", "schemars", "transport-io", "transport-streamable-http-server", "transport-streamable-http-server-session" ] }

[dev-dependencies]
async-trait = "0.1.92"
rmcp = { version = "3.1.2", features = [ "client", "transport-async-rw" ] }
rcgen = "0.14.9"
tokio = { version = "1.53.1", features = [ "io-util", "macros", "net", "rt-multi-thread", "sync", "time" ] }
tower = { version = "0.5.3", features = ["util"] }
