name: Publish To Kellnr

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  test:
    runs-on: rust
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Run default tests
        run: cargo test

      - name: Run axum-only tests
        run: cargo test --no-default-features --features axum

      - name: Run all-feature tests
        run: cargo test --all-features

  publish:
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: rust
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Validate publish token
        run: |
          if [ -z "$CARGO_REGISTRIES_KELLNR_TOKEN" ]; then
            echo "Missing secret: KELLNR_TOKEN"
            exit 1
          fi

      - name: Verify package contents
        run: cargo publish --dry-run --registry kellnr

      - name: Publish cloudiful-server to Kellnr
        run: cargo publish --registry kellnr
